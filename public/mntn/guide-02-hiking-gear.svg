<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Wanderer mit orangefarbenem Rucksack auf einem Felsvorsprung vor schroffen Gipfeln">
  <defs>
    <linearGradient id="g2-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9C4C6"/>
      <stop offset="0.55" stop-color="#D3DBD9"/>
      <stop offset="1" stop-color="#E7ECE6"/>
    </linearGradient>
    <linearGradient id="g2-peaks" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7BFC0"/>
      <stop offset="1" stop-color="#7E8A8B"/>
    </linearGradient>
    <linearGradient id="g2-green" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#7C9E5A"/>
      <stop offset="1" stop-color="#3D5C33"/>
    </linearGradient>
    <linearGradient id="g2-rock" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#A9A8A0"/>
      <stop offset="0.5" stop-color="#7E7D77"/>
      <stop offset="1" stop-color="#4C4C48"/>
    </linearGradient>
    <linearGradient id="g2-vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1D26" stop-opacity="0.08"/>
      <stop offset="0.55" stop-color="#0B1D26" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B1D26" stop-opacity="0.34"/>
    </linearGradient>
    <filter id="g2-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="g2-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#g2-sky)"/>
  <g filter="url(#g2-soft)" opacity="0.8">
    <ellipse cx="300" cy="220" rx="360" ry="70" fill="#EDF1EE"/>
    <ellipse cx="760" cy="330" rx="300" ry="60" fill="#DFE5E2"/>
  </g>

  <!-- jagged snow peaks -->
  <path d="M0 520 L110 380 L200 470 L300 340 L400 480 L520 360 L640 500 L760 400 L900 520 L900 780 L0 780 Z" fill="url(#g2-peaks)"/>
  <path d="M300 340 L346 400 L380 372 L400 480 L268 452 Z" fill="#F1F4F1" opacity="0.85"/>
  <path d="M520 360 L566 424 L602 396 L640 500 L488 470 Z" fill="#F1F4F1" opacity="0.75"/>
  <path d="M110 380 L152 442 L184 418 L200 470 L84 452 Z" fill="#F1F4F1" opacity="0.7"/>

  <!-- green mid slope / valley -->
  <path d="M0 760 L200 690 L420 756 L640 686 L900 762 L900 1000 L0 1000 Z" fill="url(#g2-green)"/>
  <path d="M0 880 L240 812 L520 878 L780 806 L900 856 L900 1200 L0 1200 Z" fill="#2E4A2B"/>

  <!-- foreground boulder the hiker stands on -->
  <path d="M120 1200 L180 960 L330 878 L520 900 L660 1010 L720 1200 Z" fill="url(#g2-rock)"/>
  <path d="M330 878 L400 962 L300 1010 L200 962 Z" fill="#BCBBB2" opacity="0.5"/>
  <path d="M520 900 L580 1006 L470 1064 L392 978 Z" fill="#5F5F5A" opacity="0.55"/>

  <!-- hiker with orange pack -->
  <g transform="translate(392 782) scale(1.9)">
    <circle cx="0" cy="0" r="6" fill="#1E2A22"/>
    <rect x="-5.5" y="7" width="11" height="21" rx="4.5" fill="#243028"/>
    <rect x="-10" y="8" width="8" height="16" rx="3" fill="#E0722F"/>
    <rect x="-9" y="6" width="3" height="5" rx="1.5" fill="#F0A05A"/>
    <rect x="-5.5" y="27" width="4.5" height="20" rx="2.2" fill="#2B2B2B"/>
    <rect x="1" y="27" width="4.5" height="20" rx="2.2" fill="#2B2B2B"/>
  </g>

  <rect width="900" height="1200" fill="url(#g2-vig)"/>
  <rect width="900" height="1200" filter="url(#g2-grain)" opacity="0.07" style="mix-blend-mode:overlay"/>
</svg>
