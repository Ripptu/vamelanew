<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Wanderer auf einem schmalen Graspfad hoch über einem See">
  <defs>
    <linearGradient id="g1-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E9FC4"/>
      <stop offset="0.45" stop-color="#9FC6D9"/>
      <stop offset="1" stop-color="#DCE7E7"/>
    </linearGradient>
    <linearGradient id="g1-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93AEB6"/>
      <stop offset="1" stop-color="#6E8B93"/>
    </linearGradient>
    <linearGradient id="g1-lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#88A9B4"/>
      <stop offset="1" stop-color="#5D7F8B"/>
    </linearGradient>
    <linearGradient id="g1-slope" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#87A85C"/>
      <stop offset="0.55" stop-color="#557E3F"/>
      <stop offset="1" stop-color="#24401F"/>
    </linearGradient>
    <linearGradient id="g1-vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1D26" stop-opacity="0.10"/>
      <stop offset="0.6" stop-color="#0B1D26" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B1D26" stop-opacity="0.30"/>
    </linearGradient>
    <filter id="g1-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="g1-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#g1-sky)"/>
  <g filter="url(#g1-soft)" opacity="0.7">
    <ellipse cx="220" cy="330" rx="280" ry="52" fill="#F2F6F5"/>
    <ellipse cx="700" cy="270" rx="300" ry="44" fill="#E6EFF1"/>
  </g>

  <!-- distant range + lake -->
  <path d="M0 560 L140 495 L280 545 L430 470 L580 540 L740 490 L900 555 L900 720 L0 720 Z" fill="url(#g1-far)"/>
  <rect x="0" y="700" width="900" height="150" fill="url(#g1-lake)"/>

  <!-- valley shoulder -->
  <path d="M0 780 L260 706 L520 772 L760 700 L900 760 L900 1200 L0 1200 Z" fill="#3F6144"/>

  <!-- main grass ridge, trail running up it -->
  <path d="M-20 1200 L-20 900 C 160 820 340 764 520 742 C 680 722 800 760 920 830 L920 1200 Z" fill="url(#g1-slope)"/>
  <path d="M520 742 C 420 800 300 880 190 990 C 130 1050 90 1120 70 1200 L235 1200 C 265 1105 330 1010 420 930 C 480 876 540 830 580 800 Z" fill="#C9C09B" opacity="0.55"/>
  <path d="M-20 1200 L-20 1010 C 140 962 300 930 470 936 C 620 942 760 990 920 1080 L920 1200 Z" fill="#2C4C28" opacity="0.7"/>

  <!-- hiker with pack, back to camera -->
  <g fill="#1B2A20" opacity="0.94" transform="translate(486 754) scale(1.5)">
    <circle cx="0" cy="0" r="6.5"/>
    <rect x="-6" y="7" width="12" height="24" rx="5"/>
    <rect x="-9" y="9" width="7" height="15" rx="3" fill="#243424"/>
    <rect x="-6" y="30" width="5" height="22" rx="2.5"/>
    <rect x="1" y="30" width="5" height="22" rx="2.5"/>
  </g>

  <rect width="900" height="1200" fill="url(#g1-vig)"/>
  <rect width="900" height="1200" filter="url(#g1-grain)" opacity="0.07" style="mix-blend-mode:overlay"/>
</svg>
