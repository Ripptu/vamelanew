<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Wanderer auf einem Grashügel vor einem nebligen Bergpanorama">
  <defs>
    <linearGradient id="h-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E7C80"/>
      <stop offset="0.38" stop-color="#9EAAA9"/>
      <stop offset="0.72" stop-color="#C6CEC5"/>
      <stop offset="1" stop-color="#DCE2D6"/>
    </linearGradient>
    <linearGradient id="h-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AEB9B6"/>
      <stop offset="1" stop-color="#8B9895"/>
    </linearGradient>
    <linearGradient id="h-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8D9A93"/>
      <stop offset="1" stop-color="#5E6E67"/>
    </linearGradient>
    <linearGradient id="h-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A6B60"/>
      <stop offset="1" stop-color="#33453B"/>
    </linearGradient>
    <linearGradient id="h-grass" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7FA85F"/>
      <stop offset="0.5" stop-color="#5B8B45"/>
      <stop offset="1" stop-color="#2F4F2C"/>
    </linearGradient>
    <linearGradient id="h-vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1D26" stop-opacity="0.62"/>
      <stop offset="0.34" stop-color="#0B1D26" stop-opacity="0.12"/>
      <stop offset="0.78" stop-color="#0B1D26" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0B1D26" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="h-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="h-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#h-sky)"/>

  <!-- cloud banks -->
  <g filter="url(#h-soft)" opacity="0.85">
    <ellipse cx="300" cy="200" rx="420" ry="90" fill="#D9DFDA"/>
    <ellipse cx="980" cy="150" rx="520" ry="80" fill="#C3CBC6"/>
    <ellipse cx="1420" cy="270" rx="380" ry="95" fill="#DDE3DC"/>
    <ellipse cx="700" cy="330" rx="600" ry="70" fill="#E2E7DF" opacity="0.7"/>
  </g>

  <!-- far snow ridge -->
  <path d="M0 430 L150 350 L280 400 L430 300 L560 385 L720 320 L880 400 L1020 340 L1180 410 L1330 345 L1460 410 L1600 360 L1600 900 L0 900 Z" fill="url(#h-far)"/>
  <path d="M430 300 L470 335 L500 318 L560 385 L490 372 Z" fill="#EDF1EC" opacity="0.8"/>
  <path d="M720 320 L760 358 L800 336 L880 400 L790 388 Z" fill="#EDF1EC" opacity="0.7"/>
  <path d="M1330 345 L1372 382 L1408 362 L1460 410 L1380 400 Z" fill="#EDF1EC" opacity="0.7"/>

  <!-- mid ridge -->
  <path d="M0 560 L190 470 L360 545 L520 455 L700 540 L860 470 L1040 555 L1220 480 L1400 560 L1600 500 L1600 900 L0 900 Z" fill="url(#h-mid)"/>
  <path d="M520 455 L568 500 L604 478 L700 540 L590 528 Z" fill="#E6EBE5" opacity="0.55"/>
  <path d="M1220 480 L1272 528 L1310 505 L1400 560 L1290 548 Z" fill="#E6EBE5" opacity="0.5"/>

  <!-- near ridge -->
  <path d="M0 690 L240 600 L480 685 L760 590 L1030 690 L1300 610 L1600 700 L1600 900 L0 900 Z" fill="url(#h-near)"/>

  <!-- foreground grass hill -->
  <path d="M-20 900 L-20 640 C 200 560 460 528 700 566 C 900 598 1060 690 1200 900 Z" fill="url(#h-grass)"/>
  <path d="M-20 900 L-20 700 C 180 640 420 620 620 660 C 800 698 940 790 1030 900 Z" fill="#3C6136" opacity="0.55"/>

  <!-- lone hiker silhouette -->
  <g fill="#16201B" opacity="0.92" transform="translate(404 545) scale(1.15)">
    <circle cx="0" cy="0" r="6"/>
    <rect x="-5" y="7" width="10" height="22" rx="4"/>
    <rect x="-5" y="28" width="4" height="20" rx="2"/>
    <rect x="1" y="28" width="4" height="20" rx="2"/>
    <rect x="-13" y="9" width="7" height="4" rx="2" transform="rotate(-28 -9 11)"/>
  </g>

  <rect width="1600" height="900" fill="url(#h-vignette)"/>
  <rect width="1600" height="900" filter="url(#h-grain)" opacity="0.07" style="mix-blend-mode:overlay"/>
</svg>
